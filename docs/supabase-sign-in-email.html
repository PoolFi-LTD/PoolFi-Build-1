<!doctype html>
<!--
  PoolFi's sign-in code email, for Supabase (Authentication → Emails → Templates).
  Paste it into both "Confirm sign up" (new accounts) and "Magic link or OTP"
  (returning ones), with the subject: Your PoolFi code is {{ .Token }}
  Supabase fills in {{ .Token }}, the 6-digit code the app asks for.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your PoolFi code</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0b1530">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0">Your code is {{ .Token }}. It works once.</div>
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f7fb;padding:28px 12px">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:22px;overflow:hidden">
            <tr>
              <td style="background:#1b4fd8;padding:22px 28px;color:#ffffff;font-size:22px;font-weight:700;letter-spacing:-0.3px">PoolFi</td>
            </tr>
            <tr>
              <td style="padding:30px 28px 28px">
                <h1 style="margin:0 0 14px;font-size:23px;line-height:1.3;letter-spacing:-0.4px">Here's your code</h1>
                <p style="margin:0 0 20px;font-size:15px;line-height:1.55">Type it into PoolFi to confirm it's you.</p>
                <div style="margin:0 0 22px;padding:18px 8px;border-radius:16px;background:#eff3fc;text-align:center;font-size:32px;font-weight:700;letter-spacing:6px;color:#052698">{{ .Token }}</div>
                <p style="margin:0;font-size:14px;line-height:1.55;color:#5b6478">It works once and expires soon, so use it now. Nobody from PoolFi will ever ask you for it.</p>
              </td>
            </tr>
            <tr>
              <td style="padding:0 28px 26px;color:#5b6478;font-size:12px;line-height:1.5">If you didn't ask to sign in to PoolFi, you can ignore this email.</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
